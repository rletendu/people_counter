; PlatformIO project: ultrasonic people counter (Arduino Nano + TM1637)
;
; Two environments are provided because Nano clones ship with either bootloader:
;   - nano_new : new bootloader (115200 baud upload), original Arduino Nano
;   - nano_old : old bootloader (57600 baud upload), most Chinese clones (CH340)
; If an upload fails with "not in sync", try the other environment.

[platformio]
default_envs = nano_old
[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600
monitor_echo = yes
monitor_eol = LF
lib_deps =
    smougenot/TM1637
    pololu/VL53L1X

[env:nano_new]
board = nanoatmega328new

[env:nano_old]
board = nanoatmega328
